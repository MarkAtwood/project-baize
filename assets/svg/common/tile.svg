<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g class="baize-tile">
    <!-- Tile body -->
    <rect x="4" y="4" width="92" height="92" rx="4" ry="4"
      fill="var(--tile-fill, #f0e6d2)" stroke="var(--tile-border, #8b7355)" stroke-width="2"/>
    <!-- Inner border -->
    <rect x="10" y="10" width="80" height="80" rx="2" ry="2"
      fill="none" stroke="var(--tile-inner-border, #c4a97d)" stroke-width="1"/>
  </g>
</svg>
