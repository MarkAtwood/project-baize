<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g class="baize-die">
    <!-- Die face -->
    <rect x="2" y="2" width="96" height="96" rx="12" ry="12"
      fill="var(--die-fill, #ffffff)" stroke="var(--die-border, #333333)" stroke-width="2"/>
    <!-- Pips: two columns of three -->
    <circle cx="28" cy="24" r="8" fill="var(--die-pip, #333333)"/>
    <circle cx="28" cy="50" r="8" fill="var(--die-pip, #333333)"/>
    <circle cx="28" cy="76" r="8" fill="var(--die-pip, #333333)"/>
    <circle cx="72" cy="24" r="8" fill="var(--die-pip, #333333)"/>
    <circle cx="72" cy="50" r="8" fill="var(--die-pip, #333333)"/>
    <circle cx="72" cy="76" r="8" fill="var(--die-pip, #333333)"/>
  </g>
</svg>
