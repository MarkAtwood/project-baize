name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (engine + server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
            server/target
          key: rust-${{ runner.os }}-cargo-${{ hashFiles('engine/Cargo.lock', 'server/Cargo.lock', 'engine/Cargo.toml', 'server/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-cargo-

      - name: Clippy engine
        working-directory: engine
        run: cargo clippy -- -D warnings

      - name: Test engine
        working-directory: engine
        run: cargo test

      - name: Clippy server
        working-directory: server
        run: cargo clippy -- -D warnings

      - name: Test server
        working-directory: server
        run: cargo test

  python:
    name: Python (library + cross-implementation tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -e python/[dev]

      - name: Type-check Python
        run: python3 -m mypy python/baize/

      - name: Run Python tests
        working-directory: python
        run: python3 -m pytest tests/ -v

      - name: Run cross-implementation tests
        run: python3 -m pytest tests/ -v

  typescript:
    name: TypeScript (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Type-check
        working-directory: client
        run: npx tsc --noEmit
