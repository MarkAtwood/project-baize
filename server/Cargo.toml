[package]
name = "baize-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "Baize WebSocket game server — routes moves through the engine, manages hidden state and randomness"

[[bin]]
name = "baize-server"
path = "src/main.rs"

[dependencies]
baize-engine = { path = "../engine" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_chacha = "0.9"
wasmtime = { version = "34", optional = true }

[features]
default = []
wasm-host = ["dep:wasmtime"]
