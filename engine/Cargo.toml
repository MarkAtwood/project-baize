[package]
name = "baize-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Baize declarative board game engine — parses game definitions, validates moves, computes state transitions"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1.8", default-features = false }
bitflags = "2"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[features]
default = []
wasm = ["blake3/wasm32_simd"]

[profile.release]
opt-level = "s"
lto = true
strip = true
